[workspace]
members = ["crates/clipsync-core", "crates/clipsync-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4", "serde"] }

